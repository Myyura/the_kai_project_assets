<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440"><rect width="640" height="440" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><g font-family="Arial, sans-serif" font-size="20" fill="#334155"><text x="30" y="34">D₁: 0 ≤ y ≤ 2x ≤ 2</text><path d="M150,355 L390,355 L390,115 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M100,355 H550 M150,390 V65" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="363">x</text><text x="128" y="70">y</text><text x="123" y="380">0</text><text x="385" y="380">1</text><text x="112" y="122">2</text><path d="M150,115 H390" stroke="#94a3b8" stroke-dasharray="5 5"/><text x="310" y="300" font-size="28">D₁</text><text x="205" y="210">y = 2x</text><text x="408" y="135">(1, 2)</text><text x="30" y="424" font-size="17">All three sides are included.</text></g></svg>