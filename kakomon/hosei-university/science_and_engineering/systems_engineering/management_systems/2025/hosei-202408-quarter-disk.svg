<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440"><rect width="640" height="440" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><g font-family="Arial, sans-serif" font-size="20" fill="#334155"><text x="30" y="34">D: x ≥ 0, y ≥ 0, x² + y² ≤ 3</text><path d="M150,355 H450 A300,300 0 0 0 150,55 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M100,355 H550 M150,390 V45" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="363">x</text><text x="128" y="55">y</text><text x="122" y="380">0</text><text x="438" y="380">√3</text><text x="105" y="80">√3</text><text x="280" y="250" font-size="28">D</text><text x="410" y="160">x² + y² = 3</text><text x="30" y="424" font-size="17">The arc and both axis segments are included.</text></g></svg>