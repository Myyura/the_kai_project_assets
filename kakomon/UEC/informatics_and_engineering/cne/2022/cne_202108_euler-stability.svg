<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
  <title id="title">Euler method stability regions</title>
  <desc id="desc">Explicit Euler: the closed disk centered at minus one with radius one. Implicit Euler: the exterior of the open disk centered at one with radius one. Both include the boundary.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#374151"/></marker>
  </defs>
  <rect width="760" height="310" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#111827" text-anchor="middle">
    <text x="190" y="28" font-size="19">Explicit Euler</text>
    <text x="570" y="28" font-size="19">Implicit Euler</text>
    <text x="190" y="53" font-size="17">|1 + z| ≤ 1</text>
    <text x="570" y="53" font-size="17">|1 − z| ≥ 1</text>
  </g>
  <rect x="398" y="70" width="344" height="210" rx="3" fill="#dbeafe"/>
  <circle cx="150" cy="175" r="65" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="575" cy="175" r="65" fill="white" stroke="#1d4ed8" stroke-width="2"/>
  <g fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)">
    <path d="M35,175 H354"/>
    <path d="M215,278 V76"/>
    <path d="M414,175 H729"/>
    <path d="M510,278 V76"/>
  </g>
  <g stroke="#374151" stroke-width="1">
    <path d="M85,171 V179 M150,171 V179 M280,171 V179 M211,110 H219 M211,240 H219"/>
    <path d="M445,171 V179 M575,171 V179 M640,171 V179 M506,110 H514 M506,240 H514"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#111827" text-anchor="middle">
    <text x="85" y="196">−2</text><text x="150" y="196">−1</text><text x="224" y="196">0</text><text x="280" y="196">1</text>
    <text x="445" y="196">−1</text><text x="519" y="196">0</text><text x="575" y="196">1</text><text x="640" y="196">2</text>
    <text x="232" y="115">i</text><text x="234" y="245">−i</text>
    <text x="527" y="115">i</text><text x="529" y="245">−i</text>
    <text x="347" y="162">Re z</text><text x="236" y="84">Im z</text>
    <text x="722" y="162">Re z</text><text x="531" y="84">Im z</text>
  </g>
</svg>
