dth="3" stroke-dasharray=""/><circle cx="683.33" cy="211.67" r="6" fill="#2563eb"/><text x="507" y="54" font-size="17">y</text><text x="818" y="291" font-size="17">x</text><text x="482" y="307" font-size="17">O</text><text x="507" y="104" font-size="17">φ</text><text x="565" y="123" font-size="17">2a/3</text><text x="731" y="257" font-size="17">a/3</text><text x="695.3333333333334" y="201.66666666666669" font-size="17">m</text><path d="M683.33,211.67 L683.33,285.00" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/><path d="M683.33,211.67 L500.00,211.67" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/><text x="502" y="344" font-size="17">x = (2a/3) sin φ,  y = (a/3) cos φ</text></g></svg>