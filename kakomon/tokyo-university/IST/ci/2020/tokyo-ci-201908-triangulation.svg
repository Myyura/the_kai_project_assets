<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" role="img"><title>Triangulation recurrence around the base edge</title><style>text{font-family:Arial,sans-serif;font-size:16px;fill:#172c43}.wire{fill:none;stroke:#233e59;stroke-width:2}.box{fill:white;stroke:#233e59;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><polygon points="80,280 55,195 95,105 195,60 330,45" fill="#dbeafe"/><polygon points="330,45 465,95 550,200 570,280" fill="#dcfce7"/><polygon points="80,280 330,45 570,280" fill="#fef3c7"/><polygon points="80,280 55,195 95,105 195,60 330,45 465,95 550,200 570,280" fill="none" stroke="#243c58" stroke-width="2"/><path class="wire" d="M80,280L330,45L570,280"/><circle cx="80" cy="280" r="4" fill="#243c58"/><circle cx="55" cy="195" r="4" fill="#243c58"/><circle cx="95" cy="105" r="4" fill="#243c58"/><circle cx="195" cy="60" r="4" fill="#243c58"/><circle cx="330" cy="45" r="4" fill="#243c58"/><circle cx="465" cy="95" r="4" fill="#243c58"/><circle cx="550" cy="200" r="4" fill="#243c58"/><circle cx="570" cy="280" r="4" fill="#243c58"/><text x="38" y="307" text-anchor="start">v_i</text><text x="314" y="29" text-anchor="start">v_k</text><text x="543" y="309" text-anchor="start">v_(i+m−1)</text><text x="80" y="173" text-anchor="start">E[i, k−i+1]</text><text x="398" y="173" text-anchor="start">E[k, i+m−k]</text><text x="264" y="230" text-anchor="start">triangle</text><text x="213" y="337" text-anchor="start">E[i,m] = left + right + triangle cost</text></svg>