<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="title description">
<title id="title">Triangular probability density</title>
<desc id="description">p(x) = 1 - |x| for -1 ≤ x ≤ 1, and zero otherwise.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#172b4d">
<line id="decoration-1" x1="35" y1="245" x2="525" y2="245" stroke="#172b4d" stroke-width="1.5"/>
<line id="decoration-2" x1="280" y1="251.8" x2="280" y2="49.5" stroke="#172b4d" stroke-width="1.5"/>
<text id="decoration-3" x="537" y="250" text-anchor="middle">x</text>
<text id="decoration-4" x="280" y="37.5" text-anchor="middle">p(x)</text>
<polyline id="density" points="52.5,245 105,245 280,75 455,245 507.5,245" fill="none" stroke="#2563eb" stroke-width="2"/>
<line id="decoration-5" x1="105" y1="241" x2="105" y2="249" stroke="#64748b" stroke-width="1.5"/>
<text id="decoration-6" x="105" y="267" text-anchor="middle">-1</text>
<line id="decoration-7" x1="280" y1="241" x2="280" y2="249" stroke="#64748b" stroke-width="1.5"/>
<text id="decoration-8" x="292" y="267" text-anchor="middle">0</text>
<line id="decoration-9" x1="455" y1="241" x2="455" y2="249" stroke="#64748b" stroke-width="1.5"/>
<text id="decoration-10" x="455" y="267" text-anchor="middle">1</text>
<text id="decoration-11" x="260" y="78" text-anchor="middle">1</text>
</g>
</svg>
