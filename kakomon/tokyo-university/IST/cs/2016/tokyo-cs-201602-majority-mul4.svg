<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 665" role="img"><title>Four-bit shift-and-add multiplier using majority full adders</title><rect width="100%" height="100%" fill="white"/>
<text x="25" y="32" font-family="Arial, sans-serif" font-size="23" fill="#172b4d" text-anchor="start">(4) Four-bit multiplier MUL₄</text>
<rect x="105" y="65" width="70" height="100" fill="#edf6ff" stroke="#243b53" stroke-width="2"/>
<text x="140" y="123" font-family="Arial, sans-serif" font-size="24" fill="#172b4d" text-anchor="middle">M₃</text>
<text x="40" y="91" font-family="Arial, sans-serif" font-size="19" fill="#172b4d" text-anchor="start">aᵢ</text>
<path d="M75,85 L105,85" fill="none" stroke="#243b53" stroke-width="2"/>
<text x="40" y="121" font-family="Arial, sans-serif" font-size="19" fill="#172b4d" text-anchor="start">bⱼ</text>
<path d="M75,115 L105,115" fill="none" stroke="#243b53" stroke-width="2"/>
<text x="40" y="151" font-family="Arial, sans-serif" font-size="19" fill="#172b4d" text-anchor="start">0</text>
<path d="M75,145 L105,145" fill="none" stroke="#243b53" stroke-width="2"/>
<path d="M175,115 L205,115" fill="none" stroke="#243b53" stroke-width="2"/>
<text x="215" y="122" font-family="Arial, sans-serif" font-size="19" fill="#172b4d" text-anchor="start">pᵢⱼ</text>
<text x="350" y="107" font-family="Arial, sans-serif" font-size="20" fill="#172b4d" text-anchor="start">Generate all 16 partial products in parallel.</text>
<text x="350" y="142" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="start">Vectors below are listed most-significant bit first.</text>
<text x="25" y="237" font-family="Arial, sans-serif" font-size="20" fill="#172b4d" text-anchor="start">A = (0, p₃₀, p₂₀, p₁₀)</text>
<text x="25" y="278" font-family="Arial, sans-serif" font-size="20" fill="#172b4d" text-anchor="start">B = (p₃₁, p₂₁, p₁₁, p₀₁)</text>
<path d="M345,230 L435,230" fill="none" stroke="#243b53" stroke-width="2"/>
<path d="M345,270 L435,270" fill="none" stroke="#243b53" stroke-width="2"/>
<rect x="435" y="205" width="180" height="95" fill="#edf6ff" stroke="#243b53" stroke-width="2"/>
<text x="525" y="238" font-family="Arial, sans-serif" font-size="24" fill="#172b4d" text-anchor="middle">FA₄</text>
<text x="525" y="273" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">carry in = 0</text>
<path d="M615,250 L685,250" fill="none" stroke="#243b53" stroke-width="2"/>
<text x="700" y="257" font-family="Arial, sans-serif" font-size="22" fill="#172b4d" text-anchor="start">R₄ … R₀</text>
<text x="900" y="257" font-family="Arial, sans-serif" font-size="20" fill="#172b4d" text-anchor="start">depth ≤ 6</text>
<text x="25" y="362" font-family="Arial, sans-serif" font-size="20" fill="#172b4d" text-anchor="start">A = (R₄, R₃, R₂, R₁)</text>
<text x="25" y="403" font-family="Arial, sans-serif" font-size="20" fill="#172b4d" text-anchor="start">B = (p₃₂, p₂₂, p₁₂, p₀₂)</text>
<path d="M345,355 L435,355" fill="none" stroke="#243b53" stroke-width="2"/>
<path d="M345,395 L435,395" fill="none" stroke="#243b53" stroke-width="2"/>
<rect x="435" y="330" width="180" height="95" fill="#edf6ff" stroke="#243b53" stroke-width="2"/>
<text x="525" y="363" font-family="Arial, sans-serif" font-size="24" fill="#172b4d" text-anchor="middle">FA₄</text>
<text x="525" y="398" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">carry in = 0</text>
<path d="M615,375 L685,375" fill="none" stroke="#243b53" stroke-width="2"/>
<text x="700" y="382" font-family="Arial, sans-serif" font-size="22" fill="#172b4d" text-anchor="start">V₄ … V₀</text>
<text x="900" y="382" font-family="Arial, sans-serif" font-size="20" fill="#172b4d" text-anchor="start">depth ≤ 9</text>
<text x="25" y="487" font-family="Arial, sans-serif" font-size="20" fill="#172b4d" text-anchor="start">A = (V₄, V₃, V₂, V₁)</text>
<text x="25" y="528" font-family="Arial, sans-serif" font-size="20" fill="#172b4d" text-anchor="start">B = (p₃₃, p₂₃, p₁₃, p₀₃)</text>
<path d="M345,480 L435,480" fill="none" stroke="#243b53" stroke-width="2"/>
<path d="M345,520 L435,520" fill="none" stroke="#243b53" stroke-width="2"/>
<rect x="435" y="455" width="180" height="95" fill="#edf6ff" stroke="#243b53" stroke-width="2"/>
<text x="525" y="488" font-family="Arial, sans-serif" font-size="24" fill="#172b4d" text-anchor="middle">FA₄</text>
<text x="525" y="523" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">carry in = 0</text>
<path d="M615,500 L685,500" fill="none" stroke="#243b53" stroke-width="2"/>
<text x="700" y="507" font-family="Arial, sans-serif" font-size="22" fill="#172b4d" text-anchor="start">W₄ … W₀</text>
<text x="900" y="507" font-family="Arial, sans-serif" font-size="20" fill="#172b4d" text-anchor="start">depth ≤ 12</text>
<text x="25" y="625" font-family="Arial, sans-serif" font-size="22" fill="#172b4d" text-anchor="start">Product bits (high → low):  W₄ W₃ W₂ W₁ W₀ V₀ R₀ p₀₀</text>
<text x="25" y="656" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="start">R, V and W outputs feed the named inputs of the following row. Maximum majority depth: 12.</text>
</svg>