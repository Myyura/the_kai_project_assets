<text x="25" y="280" font-family="Arial,sans-serif" font-size="18" fill="#17324d">Carry propagation is highlighted. With unit gate delays, the longest path starts at A0 or B0.</text>
<text x="25" y="333" font-family="Arial,sans-serif" font-size="24" fill="#17324d">(4) Synchronous up-down counter (all buses listed high bit first)</text>
<rect x="385" y="385" width="230" height="95" fill="#ecf5ff" stroke="#17324d" stroke-width="2"/>
<text x="395" y="438.5" font-family="Arial,sans-serif" font-size="18" fill="#17324d">Four full adders</text>
<rect x="830" y="385" width="185" height="95" fill="#ecf5ff" stroke="#17324d" stroke-width="2"/>
<text x="840" y="438.5" font-family="Arial,sans-serif" font-size="18" fill="#17324d">DFF × 4</text>
<text x="35" y="410" font-family="Arial,sans-serif" font-size="18" fill="#17324d">K = (A̅, A̅, A̅, 1), A = X</text>
<text x="35" y="440" font-family="Arial,sans-serif" font-size="18" fill="#17324d">C0 = 0; A̅ = NOT(X)</text>
<path d="M305,420 L385,420" fill="none" stroke="#17324d" stroke-width="2"/>
<path d="M615,430 L830,430" fill="none" stroke="#17324d" stroke-width="2"/>
<text x="655" y="412" font-family="Arial,sans-serif" font-size="18" fill="#17324d">S[3:0] → D[3:0]</text>
<path d="M1015,430 L1110,430" fill="none" stroke="#17324d" stroke-width="2"/>
<text x="1030" y="410" font-family="Arial,sans-serif" font-size="18" fill="#17324d">Y = Q[3:0]</text>
<path d="M1070,430 L1070,545 L350,545 L350,460 L385,460" fill="none" stroke="#17324d" stroke-width="2"/>
<text x="515" y="575" font-family="Arial,sans-serif" font-size="18" fill="#17324d">Q[3:0] feeds the other adder operand. Discard C4.</text>
<path d="M918,515 L918,480" fill="none" stroke="#17324d" stroke-width="2"/>
<path d="M908,480 L918,466 L928,480" fill="none" stroke="#17324d" stroke-width="2"/>
<text x="942" y="512" font-family="Arial,sans-serif" font-size="18" fill="#17324d">CLK</text>
