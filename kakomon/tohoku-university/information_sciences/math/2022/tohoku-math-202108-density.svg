<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="title"><title id="title">Triangular probability density for a sum of two uniforms</title><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial,sans-serif" font-size="16" fill="#243647"><text x="28" y="28" >Density of X + Y, with X,Y independent U[−1,1]</text><line x1="50.00" y1="335.00" x2="510.00" y2="335.00" stroke="#54697a" stroke-width="1.5" /><line x1="280.00" y1="365.00" x2="280.00" y2="70.00" stroke="#54697a" stroke-width="1.5" /><text x="503" y="355" >z</text><text x="290" y="65" >f(z)</text><path d="M 70.00,335.00 L 280.00,125.00 L 490.00,335.00" fill="#e8f2fa" stroke="#2069a0" stroke-width="3"/><text x="61" y="357" >−2</text><text x="271" y="357" >0</text><text x="481" y="357" >2</text><text x="290" y="122" >1/2</text><text x="120" y="405" >f(z) = (2 − |z|)/4   for |z| ≤ 2;  0 otherwise</text></g></svg>