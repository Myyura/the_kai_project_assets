<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Two geometries: a uniformly charged ring rotating about the z axis, and a rectangular perfectly conducting cavity with side lengths a, a and b.</title><desc id="desc">Two geometries: a uniformly charged ring rotating about the z axis, and a rectangular perfectly conducting cavity with side lengths a, a and b.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#155e75"/></marker><marker id="axis" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#64748b"/></marker><marker id="red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#b45309"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:19px;fill:#172b3a}.title{font-size:23px;font-weight:bold}.small{font-size:16px}.axis{fill:none;stroke:#64748b;stroke-width:1.4;marker-end:url(#axis)}.line{fill:none;stroke:#155e75;stroke-width:2.8}.dash{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}.node{fill:#155e75}.orange{fill:none;stroke:#b45309;stroke-width:2.4}</style>
