<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="title"><title id="title">Four roots on the complex plane</title><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial,sans-serif" font-size="16" fill="#243647"><text x="24" y="28" >Four complex roots</text><line x1="60.00" y1="215.00" x2="490.00" y2="215.00" stroke="#54697a" stroke-width="1.5" /><line x1="275.00" y1="380.00" x2="275.00" y2="48.00" stroke="#54697a" stroke-width="1.5" /><text x="486" y="238" >Re z</text><text x="282" y="55" >Im z</text><circle cx="275" cy="215" r="140" fill="none" stroke="#aabccc" stroke-dasharray="5 4"/><line x1="275.00" y1="215.00" x2="293.27" y2="76.20" stroke="#86adc6" stroke-width="1" /><circle cx="293.27366691080726" cy="76.19771940766654" r="5" fill="#2069a0"/><text x="302.27366691080726" y="67.19771940766654" >z0</text><line x1="275.00" y1="215.00" x2="136.20" y2="196.73" stroke="#86adc6" stroke-width="1" /><circle cx="136.19771940766654" cy="196.7263330891928" r="5" fill="#2069a0"/><text x="145.19771940766654" y="187.7263330891928" >z1</text><line x1="275.00" y1="215.00" x2="256.73" y2="353.80" stroke="#86adc6" stroke-width="1" /><circle cx="256.7263330891928" cy="353.80228059233343" r="5" fill="#2069a0"/><text x="265.7263330891928" y="344.80228059233343" >z2</text><line x1="275.00" y1="215.00" x2="413.80" y2="233.27" stroke="#86adc6" stroke-width="1" /><circle cx="413.80228059233343" cy="233.27366691080724" r="5" fill="#2069a0"/><text x="422.80228059233343" y="224.27366691080724" >z3</text><text x="80" y="404" >|z| = 2^(−1/4),  arg z = 11π/24 + jπ/2,  j = 0,1,2,3</text></g></svg>