<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#617083"/></marker></defs><rect width="720" height="400" fill="white"/><g font-family="Arial, sans-serif" font-size="16" fill="#16263c"><text x="28" y="31" fill="#16263c">Parallel circuit: I = I1 + I2</text><line x1="50" y1="260" x2="665" y2="260" stroke="#617083" stroke-width="2"/><polygon points="665,260 655.0,256.0 655.0,264.0" fill="#617083"/><line x1="150" y1="345" x2="150" y2="65" stroke="#617083" stroke-width="2"/><polygon points="150,65 146.0,75.0 154.0,75.0" fill="#617083"/><text x="661" y="284" fill="#16263c">Re</text><text x="158" y="67" fill="#16263c">Im</text><line x1="150" y1="260" x2="410.0" y2="260.0" stroke="#126b4b" stroke-width="2"/><polygon points="410.0,260.0 400.0,256.0 400.0,264.0" fill="#126b4b"/><text x="420.0" y="284.0" fill="#126b4b">I1 = 4 A</text><line x1="150" y1="260" x2="280.0" y2="130.0" stroke="#9b4b97" stroke-width="2"/><polygon points="280.0,130.0 270.1005050633883,134.2426406871193 275.75735931288074,139.89949493661166" fill="#9b4b97"/><text x="290.0" y="120.0" fill="#9b4b97">I2 = 2 + j2 A</text><line x1="150" y1="260" x2="540.0" y2="130.0" stroke="#1369ac" stroke-width="2"/><polygon points="540.0,130.0 529.2482559554275,129.36754446796633 531.7780780835623,136.95701085237042" fill="#1369ac"/><text x="550.0" y="122.0" fill="#1369ac">I = 6 + j2 A</text><text x="32" y="375" fill="#16263c">V = 100 V points along +Re; the second branch is a series RC circuit.</text></g></svg>