<svg xmlns="http://www.w3.org/2000/svg" width="780" height="280" viewBox="0 0 780 280" role="img" aria-labelledby="title"><title id="title">Images under w=(z−1)/(z+1): two punctured circles and a half-open segment</title><rect width="780" height="280" fill="white"/><g transform="translate(0,0)"><g font-family="Georgia,serif" font-size="18" fill="#111827"><text x="35" y="25">(a) Re z = 0</text><text x="237" y="165">u</text><text x="126" y="54">v</text><text x="120" y="181">0</text></g><g stroke="#9ca3af" stroke-width="1"><path d="M20 160H235M130 55V249"/></g><circle cx="130" cy="160" r="75" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="205" cy="160" r="5" fill="white" stroke="#2563eb" stroke-width="2"/><text x="198" y="186" font-family="Georgia,serif" font-size="18">1</text></g><g transform="translate(260,0)"><g font-family="Georgia,serif" font-size="18" fill="#111827"><text x="35" y="25">(b) Re z = 1</text><text x="237" y="165">u</text><text x="126" y="54">v</text><text x="120" y="181">0</text></g><g stroke="#9ca3af" stroke-width="1"><path d="M20 160H235M130 55V249"/></g><circle cx="167.5" cy="160" r="37.5" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="205" cy="160" r="5" fill="white" stroke="#2563eb" stroke-width="2"/><text x="198" y="186" font-family="Georgia,serif" font-size="18">1</text></g><g transform="translate(520,0)"><g font-family="Georgia,serif" font-size="18" fill="#111827"><text x="35" y="25">(c) z real, z ≥ 0</text><text x="237" y="165">u</text><text x="126" y="54">v</text><text x="120" y="181">0</text></g><g stroke="#9ca3af" stroke-width="1"><path d="M20 160H235M130 55V249"/></g><path d="M55 160H205" stroke="#2563eb" stroke-width="4"/><circle cx="55" cy="160" r="5" fill="#2563eb"/><circle cx="205" cy="160" r="5" fill="white" stroke="#2563eb" stroke-width="2"/><text x="40" y="186" font-family="Georgia,serif" font-size="18">−1</text><text x="198" y="186" font-family="Georgia,serif" font-size="18">1</text></g></svg>