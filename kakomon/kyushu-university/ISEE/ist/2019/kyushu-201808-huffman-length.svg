<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-labelledby="title desc"><title id="title">Huffman mean code length</title><desc id="desc">L(alpha) increases from an excluded value 7/4 at alpha=0 to 2 at alpha=1/4, and remains 2 through alpha=1/2.</desc><rect width="560" height="330" fill="white"/><g stroke="#222" stroke-width="1.5" fill="none"><path d="M75 270H510M85 280V30"/><path d="M510 270l-8-4v8zM85 30l-4 8h8z" fill="#222"/><path d="M85 170H485M85 80H485M285 80V270M485 80V270" stroke="#aaa" stroke-dasharray="5 5"/></g><path d="M85 170L285 80H485" fill="none" stroke="#126ca3" stroke-width="3"/><circle cx="85" cy="170" r="5" fill="white" stroke="#126ca3" stroke-width="2"/><g fill="#126ca3"><circle cx="285" cy="80" r="4"/><circle cx="485" cy="80" r="4"/></g><g fill="#222" font-family="serif" font-size="19"><text x="48" y="178">7/4</text><text x="61" y="87">2</text><text x="74" y="298">0</text><text x="272" y="298">1/4</text><text x="472" y="298">1/2</text><text x="520" y="278">α</text><text x="41" y="32">L(α)</text><text x="160" y="105">L = 7/4 + α</text><text x="365" y="61">L = 2</text></g></svg>