<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"><rect width="760" height="430" fill="white"/><g font-family="Arial, sans-serif" font-size="18" fill="#334155"><text x="25" y="29">Waiting time W(t): example x = 4, y = 6, third interval = 10 min</text><text x="25" y="56">Values at arrivals are taken just after departure (right-continuous).</text><path d="M75,85 V340 H710" stroke="#334155" fill="none" stroke-width="2"/><text x="24" y="85">W(t)</text><text x="718" y="347">t</text><path d="M75,244 H680" stroke="#e2e8f0"/><text x="44" y="250">4</text><path d="M75,196 H680" stroke="#e2e8f0"/><text x="44" y="202">6</text><path d="M75,100 H680" stroke="#e2e8f0"/><text x="44" y="106">10</text><text x="65" y="370">0</text><text x="265" y="370">20</text><text x="465" y="370">40</text><text x="665" y="370">60</text><path d="M75,244 L115,340" stroke="#2563eb" stroke-width="3" fill="none"/><circle cx="75" cy="244" r="4" fill="#2563eb"/><circle cx="115" cy="340" r="4" fill="white" stroke="#2563eb" stroke-width="2"/><path d="M115,196 L175,340" stroke="#2563eb" stroke-width="3" fill="none"/><circle cx="115" cy="196" r="4" fill="#2563eb"/><circle cx="175" cy="340" r="4" fill="white" stroke="#2563eb" stroke-width="2"/><path d="M175,100 L275,340" stroke="#2563eb" stroke-width="3" fill="none"/><circle cx="175" cy="100" r="4" fill="#2563eb"/><circle cx="275" cy="340" r="4" fill="white" stroke="#2563eb" stroke-width="2"/><path d="M275,244 L315,340" stroke="#2563eb" stroke-width="3" fill="none"/><circle cx="275" cy="244" r="4" fill="#2563eb"/><circle cx="315" cy="340" r="4" fill="white" stroke="#2563eb" stroke-width="2"/><path d="M315,196 L375,340" stroke="#2563eb" stroke-width="3" fill="none"/><circle cx="315" cy="196" r="4" fill="#2563eb"/><circle cx="375" cy="340" r="4" fill="white" stroke="#2563eb" stroke-width="2"/><path d="M375,100 L475,340" stroke="#2563eb" stroke-width="3" fill="none"/><circle cx="375" cy="100" r="4" fill="#2563eb"/><circle cx="