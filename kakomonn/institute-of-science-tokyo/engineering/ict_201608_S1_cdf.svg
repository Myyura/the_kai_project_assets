<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" role="img" aria-labelledby="title description">
<title id="title">CDF of T</title>
<desc id="description">F_T(t) = P(T ≤ t); jumps: 0.7 at t = -1, 0.3 at t = 1</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#172b4d">
<line id="decoration-1" x1="75" y1="250" x2="615" y2="250" stroke="#64748b" stroke-width="1.5"/>
<line id="decoration-2" x1="340" y1="275" x2="340" y2="25" stroke="#64748b" stroke-width="1.5"/>
<text id="decoration-3" x="626" y="255" text-anchor="middle">t</text>
<text id="decoration-4" x="365" y="25" text-anchor="middle">F_T(t)</text>
<line id="cdf-guide-0" x1="75" y1="117" x2="610" y2="117" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 5"/>
<text id="cdf-level-label-0" x="63" y="122" text-anchor="end">0.7</text>
<line id="cdf-guide-1" x1="75" y1="60" x2="610" y2="60" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 5"/>
<text id="cdf-level-label-1" x="63" y="65" text-anchor="end">1</text>
<text id="cdf-support-label-0" x="220" y="277" text-anchor="middle">-1</text>
<text id="cdf-support-label-1" x="460" y="277" text-anchor="middle">1</text>
<line id="cdf-step-0" x1="100" y1="250" x2="220" y2="250" stroke="#2563eb" stroke-width="3"/>
<line id="cdf-step-1" x1="220" y1="117" x2="460" y2="117" stroke="#2563eb" stroke-width="3"/>
<line id="cdf-step-2" x1="460" y1="60" x2="580" y2="60" stroke="#2563eb" stroke-width="3"/>
<circle id="cdf-open-0" cx="220" cy="250" r="5" fill="white" stroke="#2563eb" stroke-width="2"/>
<circle id="cdf-closed-0" cx="220" cy="117" r="5" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<circle id="cdf-open-1" cx="460" cy="117" r="5" fill="white" stroke="#2563eb" stroke-width="2"/>
<circle id="cdf-closed-1" cx="460" cy="60" r="5" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text id="caption" x="340" y="303" text-anchor="middle" font-size="13">F_T(t) = P(T ≤ t); jumps: 0.7 at t = -1, 0.3 at t = 1</text>
</g>
