<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 345" width="700" height="345" role="img" aria-labelledby="title description">
<title id="title">Surface of revolution: interval a to b</title>
<desc id="description">Schematic of a smooth nonnegative curve y=f(x) above the x-axis, with endpoint guides at a and b. The curve is rotated about the x-axis.</desc>
<rect x="0" y="0" width="700" height="345" fill="white"/>
<path id="axis" d="M 65 280 H 647" fill="none" stroke="#222" stroke-width="2"/>
<path d="M 647 280 L 636 275 L 636 285 Z" fill="#222"/>
<path id="curve" d="M 130 132 C 245 45 390 230 510 176" fill="none" stroke="#222" stroke-width="2.4"/>
<path id="extensions" d="M 90 162.2608695652 L 130 132 M 510 176 L 550 158" fill="none" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4"/>
<line id="a-guide" x1="130" y1="132" x2="130" y2="280" stroke="#888"/>
<line id="b-guide" x1="510" y1="176" x2="510" y2="280" stroke="#888"/>
<text id="a-label" x="124" y="313" font-family="Georgia, serif" font-size="24" font-style="italic">a</text>
<text id="b-label" x="504" y="313" font-family="Georgia, serif" font-size="24" font-style="italic">b</text>
<text id="x-label" x="657" y="287" font-family="Georgia, serif" font-size="24" font-style="italic">x</text>
<text id="f-label" x="557" y="146" font-family="Georgia, serif" font-size="25" font-style="italic">y = f(x)</text>
</svg>
