<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 430" role="img" aria-label="Domains in the xy and uv planes">
<title>Domains in the xy and uv planes</title>
<rect width="890" height="430" fill="white"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#172b4d">
<text x="225" y="29" text-anchor="middle" font-size="16">D in the xy-plane</text>
<text x="665" y="29" text-anchor="middle" font-size="16">D′ in the uv-plane</text>
<polygon points="82.50,267.50 177.50,362.50 367.50,172.50 272.50,77.50 82.50,267.50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<line x1="27" y1="220" x2="421" y2="220" stroke="#64748b" stroke-width="1.5" stroke-dasharray=""/>
<line x1="225" y1="410" x2="225" y2="45" stroke="#64748b" stroke-width="1.5" stroke-dasharray=""/>
<text x="414" y="243" text-anchor="middle" font-size="16">x</text>
<text x="240" y="53" text-anchor="middle" font-size="16">y</text>
<text x="72.5" y="293.5" text-anchor="middle" font-size="14">(-3/2,-1/2)</text>
<text x="177.5" y="392.5" text-anchor="middle" font-size="14">(-1/2,-3/2)</text>
<text x="367.5" y="158.5" text-anchor="middle" font-size="14">(3/2,1/2)</text>
<text x="272.5" y="61.5" text-anchor="middle" font-size="14">(1/2,3/2)</text>
<polygon points="515.00,330.00 815.00,330.00 815.00,110.00 515.00,110.00 515.00,330.00" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<line x1="462" y1="220" x2="869" y2="220" stroke="#64748b" stroke-width="1.5" stroke-dasharray=""/>
