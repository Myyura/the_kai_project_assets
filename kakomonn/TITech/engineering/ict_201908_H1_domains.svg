<text x="867" y="245" text-anchor="middle" font-size="16">u</text>
<text x="682" y="60" text-anchor="middle" font-size="16">v</text>
<text x="515" y="244" text-anchor="middle" font-size="16">-2</text>
<text x="815" y="244" text-anchor="middle" font-size="16">2</text>
<text x="650" y="335" text-anchor="end" font-size="16">-1</text>
<text x="650" y="115" text-anchor="end" font-size="16">1</text>
<text x="665" y="405" text-anchor="middle" font-size="16">u = x+y, v = x-y; |Jacobian| = 1/2</text>
