<g font-family="Arial, sans-serif" font-size="16" fill="#172b4d">
<polygon points="345.00,205.00 220.00,80.00 95.00,205.00 220.00,330.00 345.00,205.00" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
