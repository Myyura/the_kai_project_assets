<text id="hist-edge-0" x="90" y="326" text-anchor="middle">0.3</text>
<text id="hist-edge-1" x="195" y="326" text-anchor="middle">0.4</text>
<text id="hist-edge-2" x="300" y="326" text-anchor="middle">0.5</text>
