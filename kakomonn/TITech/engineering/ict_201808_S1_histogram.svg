<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 370" width="690" height="370" role="img" aria-labelledby="title description">
<title id="title">Sample frequency histogram</title>
<desc id="description">n = 20; bin width = 0.1; intervals include left endpoints</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#172b4d">
<line id="decoration-1" x1="70" y1="300" x2="645" y2="300" stroke="#64748b" stroke-width="1.5"/>
<line id="decoration-2" x1="90" y1="315" x2="90" y2="40" stroke="#64748b" stroke-width="1.5"/>
