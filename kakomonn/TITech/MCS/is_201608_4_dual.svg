<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="title description">
<title id="title">Dual feasible region</title>
<desc id="description">Display clipped at y₁ = 10; the boundary rays continue to infinity.</desc>
<rect width="100%" height="100%" fill="white"/>
