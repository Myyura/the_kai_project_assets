<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="title"><title id="title">Two Steiner junctions joining four square vertices</title><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial,sans-serif" font-size="16" fill="#243647"><text x="25" y="28" >Shortest road network (side length: 1 km)</text><line x1="95.00" y1="65.00" x2="95.00" y2="345.00" stroke="#aabccc" stroke-width="1" stroke-dasharray="5 4"/><line x1="95.00" y1="345.00" x2="375.00" y2="345.00" stroke="#aabccc" stroke-width="1" stroke-dasharray="5 4"/><line x1="375.00" y1="345.00" x2="375.00" y2="65.00" stroke="#aabccc" stroke-width="1" stroke-dasharray="5 4"/><line x1="375.00" y1="65.00" x2="95.00" y2="65.00" stroke="#aabccc" stroke-width="1" stroke-dasharray="5 4"/><line x1="95.00" y1="65.00" x2="175.83" y2="205.00" stroke="#2069a0" stroke-width="4" /><line x1="95.00" y1="345.00" x2="175.83" y2="205.00" stroke="#2069a0" stroke-width="4" /><line x1="175.83" y1="205.00" x2="294.17" y2="205.00" stroke="#2069a0" stroke-width="4" /><line x1="294.17" y1="205.00" x2="375.00" y2="345.00" stroke="#2069a0" stroke-width="4" /><line x1="294.17" y1="205.00" x2="375.00" y2="65.00" stroke="#2069a0" stroke-width="4" /><circle cx="95" cy="65" r="4" fill="#243647"/><text x="105" y="56" >A</text><circle cx="95" cy="345" r="4" fill="#243647"/><text x="105" y="336" >B</text><circle cx="375" cy="345" r="4" fill="#243647"/><text x="385" y="336" >C</text><circle cx="375" cy="65" r="4" fill="#243647"/><text x="385" y="56" >D</text><circle cx="175.82903768654762" cy="205" r="4" fill="#243647"/><text x="185.82903768654762" y="196" >S</text><circle cx="294.1709623134524" cy="205" r="4" fill="#243647"/><text x="304.1709623134524" y="196" >T</text><text x="58" y="389" >S = (1/(2√3), 1/2), T = (1 − 1/(2√3), 1/2)</text><text x="58" y="417" >Total length = 1 + √3 km</text></g></svg>