<svg xmlns="http://www.w3.org/2000/svg" width="650" height="400" viewBox="0 0 650 400" role="img"><title>Triangular weir: H measured from free surface to vertex, z to the horizontal strip of thickness dz, opening angle theta.</title><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#202020"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:19px;fill:#202020}.axis{stroke:#202020;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.line{stroke:#202020;stroke-width:2;fill:none}.dash{stroke:#888;stroke-width:1.3;stroke-dasharray:6 5;fill:none}.dim{stroke:#444;stroke-width:1.3;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.curve{stroke:#145fa1;stroke-width:2.8;fill:none}</style>
<path d="M80 55 H120 L300 310 L480 55 H520 V360 H80 Z" fill="#ddd" stroke="#202020" stroke-width="2"/>
<path d="M152 100 H448 L300 310 Z" fill="#eaf5fc"/>
<path class="line" d="M152 100 H448"/><text x="219" y="81">free surface</text>
<path d="M217 192 H383 L378 200 H222 Z" fill="white" stroke="#145fa1" stroke-width="1.6"/>
<path class="dim" d="M217 180 H383"/><text x="292" y="170">b</text>
<path class="dash" d="M383 200 H612 M448 100 H612 M300 310 H612"/>
<path class="dim" d="M547 103 V197"/><text x="558" y="158">z</text>
<path class="dim" d="M601 103 V307"/><text x="614" y="211">H</text>
<path class="line" d="M273 272 A47 47 0 0 1 327 272"/><text x="293" y="258">θ</text>
<path class="line" d="M173 160 L218 195"/><text x="123" y="153">dz</text>
<text x="171" y="387">b = 2(H - z) tan(θ/2)</text>
</svg>
